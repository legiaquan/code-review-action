name: 'AI-Powered Code Review'
description: 'Intelligent code review using AI providers (Gemini, OpenAI) with pluggable architecture'
author: 'Quan Le'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  provider:
    description: 'AI provider to use (gemini, openai)'
    required: false
    default: 'gemini'

  api_key:
    description: 'API key for the selected provider (e.g., GEMINI_API_KEY, OPENAI_API_KEY)'
    required: true

  review_level:
    description: 'Review level: diff (only changes), file (full files), full (all files)'
    required: false
    default: 'diff'

  include_globs:
    description: 'Glob patterns for files to include (comma-separated)'
    required: false
    default: 'src/**/*.ts,src/**/*.js,*.ts,*.js'

  exclude_globs:
    description: 'Glob patterns for files to exclude (comma-separated)'
    required: false
    default: '**/*.test.ts,**/*.spec.ts,**/*.d.ts,**/node_modules/**,**/dist/**,**/*.lock,**/*.min.js,**/*.bundle.js,**/coverage/**,**/.git/**'

  max_chunk_lines:
    description: 'Maximum lines per chunk for AI review'
    required: false
    default: '400'

  rules:
    description: 'Custom review rules (comma-separated or newline-separated)'
    required: false
    default: ''

  max_retries:
    description: 'Maximum number of retries for API failures'
    required: false
    default: '3'

  retry_delay:
    description: 'Base retry delay in milliseconds (with exponential backoff)'
    required: false
    default: '1000'

runs:
  using: 'node20'
  main: 'dist/index.js'
